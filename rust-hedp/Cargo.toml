[package]
name = "rust-hedp"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
minijinja = { version = "2", features = ["loader", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
anyhow = "1"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
tar = "0.4"
async-stream = "0.3.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[lib]
name = "rust_hedp"
path = "src/lib.rs"

[[bin]]
name = "hedp"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "dump"
path = "src/bin/dump.rs"
