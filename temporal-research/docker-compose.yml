version: "3.5"

# Temporal server + Web UI backed by PostgreSQL.
# Use this when you want a more production-like local environment.
# For quick prototyping, prefer: temporal server start-dev

services:
  postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    networks:
      - temporal-net

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:latest
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - LOG_LEVEL=warn
    ports:
      - "7233:7233"
    networks:
      - temporal-net

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"
    networks:
      - temporal-net

networks:
  temporal-net:
    name: temporal-net     # explicit name so Kind nodes can join it by this name
    driver: bridge
