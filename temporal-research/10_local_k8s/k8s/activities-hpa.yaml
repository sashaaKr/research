apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: temporal-activities-hpa
  namespace: temporal-workers
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: temporal-activities
  minReplicas: 2
  maxReplicas: 6     # capped low for a laptop
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:         AverageValue
          averageValue: "300m"    # 60% of the 500m limit
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# HPA requires metrics-server. Install it in Kind with:
#   make metrics-server
