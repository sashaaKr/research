# Template for Temporal Cloud mTLS credentials.
# In production, inject these via your secrets manager
# (Vault, AWS Secrets Manager, Sealed Secrets, External Secrets Operator, etc.)
# Never commit real values.
#
# To generate a K8s secret from files:
#   kubectl create secret generic temporal-cloud-tls \
#     --from-file=tls.crt=client.pem \
#     --from-file=tls.key=client.key \
#     --namespace temporal-workers

apiVersion: v1
kind: Secret
metadata:
  name: temporal-cloud-tls
  namespace: temporal-workers
type: Opaque
stringData:
  # Override TEMPORAL_HOST with your Cloud endpoint:
  #   <namespace>.<accountId>.tmprl.cloud:7233
  TEMPORAL_HOST:      "your-namespace.abc123.tmprl.cloud:7233"
  TEMPORAL_NAMESPACE: "your-namespace.abc123"
  # Paste PEM content (or reference via an external secret operator)
  TEMPORAL_TLS_CERT: |
    -----BEGIN CERTIFICATE-----
    <your-cert-here>
    -----END CERTIFICATE-----
  TEMPORAL_TLS_KEY: |
    -----BEGIN PRIVATE KEY-----
    <your-key-here>
    -----END PRIVATE KEY-----
